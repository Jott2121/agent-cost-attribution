[build-system]
# >=77 for PEP 639 (SPDX `license` string + `license-files`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-attribution"
version = "0.1.1"
description = "Per-stage token/cost attribution and silent-degradation detection for multi-agent workflow runs (stdlib-only)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Otterson" }]
keywords = ["ai", "agents", "llm", "cost", "tokens", "observability", "telemetry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
# trove-classifiers: the canonical classifier list, so tests/test_packaging.py can
# reject an invented classifier here rather than at the irreversible upload.
dev = ["pytest>=8", "pytest-cov>=5", "trove-classifiers", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/Jott2121/agent-cost-attribution"
Repository = "https://github.com/Jott2121/agent-cost-attribution"
Issues = "https://github.com/Jott2121/agent-cost-attribution/issues"

[tool.setuptools]
packages = ["agent_cost_attribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent_cost_attribution"]
# relative_files lets the coverage-comment action resolve paths from a checkout
relative_files = true
