[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-attribution"
version = "0.1.0"
description = "Per-stage token/cost attribution and silent-degradation detection for multi-agent workflow runs (stdlib-only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jeff Otterson" }]

[tool.setuptools]
packages = ["agent_cost_attribution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
