name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests + coverage gate
        run: python -m pytest -q --cov=agent_cost_attribution --cov-report=term-missing --cov-fail-under=90
      - name: Smoke-test the meter on the shipped sample
        run: python -m agent_cost_attribution examples/sample-run.json

  coverage:
    # Coverage badge + per-PR comment (self-contained, no third-party service).
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" coverage
      - name: Measure coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Coverage badge + PR comment
        uses: py-cov-action/python-coverage-comment-action@cc6cde2639ed103404ce0da9e75114ae9561e691 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  receipts:
    # Recompute published dollars from the routing receipt's stage tokens, and
    # confirm the README sample-run quote matches the meter. Live routing-demo.js
    # telemetry is not in the repo; the script prints that gap and still exits 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Recompute receipts
        run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The author bio (README "About": Jeff Otterson / Jott2121) does not name
      # an employer, so README stays in the scan. Exclusions are only the policy
      # files that have to name the markers in order to forbid them. Do not
      # exclude README to silence a hit.
      - name: Block employer / export-control markers and committed build junk
        run: |
          set -euo pipefail
          set +e
          git grep -nIiE 'lockheed|\blmco\b|\bCUI\b|ITAR|EXPORT CONTROLLED|PROPRIETARY' -- . ':!.cursor' ':!AGENTS.md' ':!.github'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::employer or export-control marker found (author bio is not an exclusion)"
            exit 1
          elif [ "$status" -ne 1 ]; then
            echo "::error::employer scan failed closed (git grep exit ${status})"
            exit 1
          fi
          if git ls-files | grep -E '(__pycache__/|\.pyc$|^\.coverage$)'; then
            echo "::error::committed build junk"
            exit 1
          fi
